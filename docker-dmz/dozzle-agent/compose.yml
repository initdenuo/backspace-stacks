services:
  dozzle-agent:
    image: amir20/dozzle:latest
    container_name: dozzle-agent
    command: agent
    restart: unless-stopped
    environment:
      DOZZLE_HOSTNAME: docker-dmz
      DOZZLE_CERT_PEM: ${DOZZLE_CERT_PEM}
      DOZZLE_KEY_PEM: ${DOZZLE_KEY_PEM}
    ports:
      - 7007:7007
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /opt/docker/dozzle-agent/cert.pem:/dozzle_cert.pem:ro
      - /opt/docker/dozzle-agent/key.pem:/dozzle_key.pem:ro