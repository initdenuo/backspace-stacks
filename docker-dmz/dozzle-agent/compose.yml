services:
  dozzle-agent:
    image: amir20/dozzle:latest
    container_name: dozzle-agent
    command: agent
    restart: unless-stopped
    environment:
      DOZZLE_HOSTNAME: docker-dmz
      DOZZLE_CERT_PEM: ${DOZZLE_CERT_PEM}
    ports:
      - 7007:7007
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro