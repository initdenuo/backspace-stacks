services:
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    environment:
      DOZZLE_HOSTNAME: docker-internal
      DOZZLE_REMOTE_AGENT: 10.0.10.7:7007
      DOZZLE_NO_ANALYTICS: "true"
    ports:
      - 8097:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /mnt/data/dozzle:/data
      - /mnt/data/dozzle/agent_cert.pem:/dozzle_cert.pem:ro
      - /mnt/data/dozzle/agent_key.pem:/dozzle_key.pem:ro